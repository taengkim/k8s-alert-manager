# Helm values for prometheus-community/kube-prometheus-stack (local dev).
# Keep this minimal — only what the dev cluster needs.

prometheus:
  prometheusSpec:
    # CRITICAL: without this, the Prometheus Operator ignores our PrometheusRules
    # (a nil ruleSelector falls back to "select nothing" instead of the chart's
    # own selector when this is left at its default `true`).
    ruleSelectorNilUsesHelmValues: false
  service:
    type: NodePort
    nodePort: 30090

alertmanager:
  service:
    type: NodePort
    nodePort: 30093
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: kam-webhook
      group_by: ['alertname', 'kam_team']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 5m
      # Explicitly empty: Helm deep-merges `config` with the chart's default,
      # which otherwise leaves in a Watchdog -> 'null' sub-route (and we no
      # longer define a 'null' receiver at all, so that config would be
      # rejected by Alertmanager outright). kam-webhook is the default
      # receiver for everything, Watchdog included.
      routes: []
    receivers:
      - name: kam-webhook
        webhook_configs:
          - url: http://host.docker.internal:8000/api/v1/webhook/alertmanager
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: dev-webhook-token

# Grafana isn't needed for dev yet — keep the install light.
grafana:
  enabled: false
