[project]
name = "kam-backend"
version = "0.1.0"
description = "k8s-alert-manager backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic",
    "aiosqlite",
    "asyncpg",
    "pydantic-settings",
    "httpx",
    "ldap3",
    "pyjwt",
    "cryptography",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    # ldap3 -> pyasn1 internal deprecation, unrelated to our code.
    "ignore:tagMap is deprecated.*:DeprecationWarning",
    "ignore:typeMap is deprecated.*:DeprecationWarning",
    # PyJWT warns that the dev-only default secret_key is short for HS256;
    # expected in tests, which use that same default.
    "ignore::jwt.InsecureKeyLengthWarning",
]

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented pattern.
ignore = ["B008"]
