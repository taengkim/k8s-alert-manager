# Least-privilege RBAC for the kam ServiceAccount (deploy/k8s/serviceaccount.yaml),
# scoped to exactly what app/services/k8s.py's K8sClientFactory ever does
# against a k8s API server it's authenticated to via k8s_auth_kind=incluster:
#
#   - PrometheusRule CRUD, but ONLY inside a cluster's own `rules_namespace`
#     (default "kam-rules") -- see K8sClientFactory.list_rules/get_rule/
#     create_rule/replace_rule/delete_rule. Namespaced Role, not
#     ClusterRole: kam must never be able to touch PrometheusRules outside
#     the one namespace it's meant to manage.
#   - Cluster-scoped `namespaces` get/list -- the rule builder's namespace
#     picker (GET /api/v1/namespaces, K8sClientFactory.list_namespaces).
#   - The `/version` endpoint -- the cluster health check
#     (app/services/cluster_health.py's VersionApi probe).
#
# Verify with (see also deploy/README.md's `kubectl auth can-i` matrix):
#   kubectl auth can-i create prometheusrules --as=system:serviceaccount:kam:kam -n kam-rules   # yes
#   kubectl auth can-i create prometheusrules --as=system:serviceaccount:kam:kam -n default     # no
#   kubectl auth can-i list namespaces        --as=system:serviceaccount:kam:kam                # yes
#   kubectl auth can-i list pods              --as=system:serviceaccount:kam:kam -A             # no
#   kubectl auth can-i delete deployments     --as=system:serviceaccount:kam:kam -A              # no

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kam-rules-editor
  namespace: kam-rules
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kam-rules-editor
  namespace: kam-rules
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kam-rules-editor
subjects:
  - kind: ServiceAccount
    name: kam
    namespace: kam
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kam-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kam-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kam-cluster-reader
subjects:
  - kind: ServiceAccount
    name: kam
    namespace: kam
