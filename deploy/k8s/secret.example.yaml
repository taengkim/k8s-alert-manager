# EXAMPLE ONLY -- every value below is a placeholder. Before deploying:
#
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
#   # edit deploy/k8s/secret.yaml with real values
#   kubectl apply -f deploy/k8s/secret.yaml
#
# deploy/k8s/secret.yaml (anything but this .example. file) is gitignored --
# never commit real credentials. Prefer generating this from your own
# secrets manager/sealed-secrets/external-secrets pipeline over hand-editing
# a plaintext file at all, if you have one available; this plain Secret is
# the minimum viable path for a first deployment.
#
# KAM_SECRET_KEY: used for both JWT session signing and Fernet-encrypting
#   stored credentials (kubeconfigs, channel configs) at rest -- see
#   backend/app/security.py. Rotating it invalidates every active session
#   AND makes every already-encrypted stored value undecryptable. Generate
#   with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#
# KAM_WEBHOOK_TOKEN: app/config.py's default is the well-known literal
#   string "dev-webhook-token" -- app/services/cluster_bootstrap.py's
#   ensure_default_cluster seeds the auto-created "local" cluster's webhook
#   auth with THIS value on every deployment's first boot (unless a cluster
#   named KAM_DEFAULT_CLUSTER_NAME already exists). POST /webhook/alertmanager
#   has no other auth, so leaving this unset means anyone who knows that
#   public default string can inject/forge alerts against a fresh
#   deployment. Generate a real value the same way as KAM_SECRET_KEY above.
apiVersion: v1
kind: Secret
metadata:
  name: kam-secrets
  namespace: kam
type: Opaque
stringData:
  KAM_SECRET_KEY: "REPLACE_ME_generate_a_long_random_value"
  KAM_WEBHOOK_TOKEN: "REPLACE_ME_generate_a_long_random_value"

  KAM_LDAP_BIND_DN: "cn=admin,dc=example,dc=org"
  KAM_LDAP_BIND_PASSWORD: "REPLACE_ME"

  KAM_SMTP_USERNAME: ""
  KAM_SMTP_PASSWORD: ""

  # asyncpg URL -- see deploy/k8s/postgres.example.yaml for a minimal
  # in-cluster Postgres (dev/small-deployment only; production should use a
  # managed database service instead -- see that file's own comment).
  KAM_DATABASE_URL: "postgresql+asyncpg://kam:REPLACE_ME@kam-postgres:5432/kam"
