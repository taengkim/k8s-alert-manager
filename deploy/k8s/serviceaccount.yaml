# Identity the kam Deployment runs as when it registers ITSELF as a
# k8s_auth_kind=incluster cluster (see deploy/README.md's cluster
# registration section) -- distinct from any OTHER cluster kam manages,
# which normally authenticates via its own stored kubeconfig/token
# credentials instead (see app/services/k8s.py's K8sClientFactory).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kam
  namespace: kam
